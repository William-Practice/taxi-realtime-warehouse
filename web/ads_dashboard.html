<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>出租车 GPS 实时数仓 · ADS 大屏</title>
<style>
  body { background:#0b1020; color:#e6f1ff; font-family:system-ui,"Microsoft YaHei",sans-serif; margin:0; padding:24px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 4px; }
  .sub { color:#7f8ea3; font-size:13px; margin-bottom:20px; }
  .cards { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
  .card { background:#131a2e; border:1px solid #22304d; border-radius:12px; padding:16px 20px; min-width:180px; }
  .card .label { color:#8aa0bd; font-size:13px; }
  .card .val { font-size:30px; font-weight:700; color:#35d0ba; margin-top:6px; }
  table { width:100%; border-collapse:collapse; background:#131a2e; border-radius:12px; overflow:hidden; }
  th,td { padding:12px 16px; text-align:left; border-bottom:1px solid #22304d; font-size:14px; }
  th { background:#1a2440; color:#9fb3d1; font-weight:500; }
  tr:last-child td { border-bottom:none; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#35d0ba; margin-right:6px; }
  .off .dot { background:#e05a5a; }
</style>
</head>
<body>
  <h1>🚕 出租车 GPS 实时数仓 · ADS 大屏</h1>
  <div class="sub"><span id="st" class="off"><span class="dot"></span><span id="stxt">连接中…</span></span> ｜ 数据源: MySQL ads_city_realtime ｜ 链路: MySQL→CDC→Paimon→DWD/DWS→ADS→WS</div>

  <div class="cards">
    <div class="card"><div class="label">总 GPS 点数</div><div class="val" id="c_gps">-</div></div>
    <div class="card"><div class="label">在线车辆数</div><div class="val" id="c_car">-</div></div>
    <div class="card"><div class="label">平均车速 (km/h)</div><div class="val" id="c_spd">-</div></div>
    <div class="card"><div class="label">载客次数</div><div class="val" id="c_load">-</div></div>
  </div>

  <table>
    <thead><tr><th>城市</th><th>日期</th><th>GPS点数</th><th>车辆数</th><th>平均车速</th><th>载客次数</th><th>更新时间</th></tr></thead>
    <tbody id="tb"><tr><td colspan="7">等待数据…</td></tr></tbody>
  </table>

<script>
const WS = "ws://192.168.56.101:8765";
function connect(){
  const ws = new WebSocket(WS);
  ws.onopen = () => { document.getElementById("st").className=""; document.getElementById("stxt").textContent="已连接"; };
  ws.onclose = () => { document.getElementById("st").className="off"; document.getElementById("stxt").textContent="断开，重连中…"; setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => {
    const rows = JSON.parse(e.data);
    let gps=0, car=0, load=0, spd=0, n=0;
    const tb = document.getElementById("tb"); tb.innerHTML = "";
    rows.forEach(r=>{
      gps += +r.gps_points||0; car += +r.taxi_cnt||0; load += +r.load_cnt||0;
      spd += +r.avg_speed||0; n++;
      tb.insertAdjacentHTML("beforeend",
        `<tr><td>${r.city_name}</td><td>${r.dt}</td><td>${r.gps_points}</td><td>${r.taxi_cnt}</td><td>${(+r.avg_speed).toFixed(2)}</td><td>${r.load_cnt}</td><td>${r.update_time||""}</td></tr>`);
    });
    document.getElementById("c_gps").textContent = gps;
    document.getElementById("c_car").textContent = car;
    document.getElementById("c_load").textContent = load;
    document.getElementById("c_spd").textContent = n ? (spd/n).toFixed(2) : "-";
  };
}
connect();
</script>
</body>
</html>
